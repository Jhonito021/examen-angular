<article class="stat-card">
  @if (icon()) {
    <span
      class="absolute right-4 top-4 z-[1] grid size-9 place-items-center rounded-xl bg-blue-50 text-blue-700"
    >
      <i [class]="icon()" aria-hidden="true"></i>
    </span>
  }
  <p class="relative z-[1] pr-10 text-sm font-medium text-slate-500">{{ label() }}</p>
  <p class="relative z-[1] mt-3 text-3xl font-extrabold text-slate-950">{{ value() }}</p>
</article>
